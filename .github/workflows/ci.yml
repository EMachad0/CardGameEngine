name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref cancels the run in progress, so superseded commits neither use runner
# minutes nor race on the rust-cache key.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The checks call neither bacon nor worktrunk, and bacon builds from source.
      - uses: jdx/mise-action@v5
        with:
          install_args: just
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      # The runner's rustup installs the toolchain from rust-toolchain.toml.
      - run: just check::all
