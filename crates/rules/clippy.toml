disallowed-macros = [
  { path = "std::assert_eq", reason = "Import pretty_assertions::assert_eq, which prints a diff." },
  { path = "std::assert_ne", reason = "Import pretty_assertions::assert_ne, which prints a diff." },
]

# The rules core is a function of seed, decks and decisions alone.
# Each item below reads a hidden input, so a replay could diverge.
# The ban covers this crate only.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "Iteration order is random per instance. Use BTreeMap or Vec." },
  { path = "std::collections::HashSet", reason = "Iteration order is random per instance. Use BTreeSet or Vec." },
]
disallowed-methods = [
  { path = "std::time::Instant::now", reason = "The clock lives in the shell. Pass time in as an action." },
  { path = "std::time::SystemTime::now", reason = "The clock lives in the shell. Pass time in as an action." },
  { path = "rules::zones::Zones::reveal", reason = "Revealed cards wait in a picking. Reveal through the Reveal effect, which starts the picking." },
  { path = "rules::zones::Zones::leave_board", reason = "Only the dead leave the board. The state check removes them." },
  { path = "rules::zones::Zones::entomb", reason = "Only the dead enter a graveyard. The state check puts them there." },
  { path = "rules::game::resolve::aftermath::standings::Standings::new", reason = "Setup starts the standings. Only the state check changes them after that." },
  { path = "rules::game::state::Seating::new", reason = "Setup starts every game. Start one through Game::new or Game::with_deck_order." },
  { path = "rules::observer::Observer::event", reason = "Report events through Game::report, which also records History and matches triggers." },
]
